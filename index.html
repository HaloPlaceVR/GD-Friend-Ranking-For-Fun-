<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GD Friend Ranking (Made For Fun)</title>

    <style>
        body {
            background: #0e0e0e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            text-align: center;
        }

        ol {
            max-width: 400px;
            margin: auto;
            font-size: 18px;
        }

        li {
            margin: 10px 0;
            background: #1c1c1c;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .row {
            display: flex;
            justify-content: space-between;
        }

        .points {
            color: #00ff88;
            font-weight: bold;
        }

        .details {
            margin-top: 8px;
            font-size: 14px;
            color: #ccc;
            display: none;
        }
    </style>
</head>
<body>

<h1>Leaderboard</h1>

<ol id="list"></ol>

<script>
    // 🔒 ONLY YOU EDIT THIS PART 🔒
    const users = [
        {
            name: "HaloPlaceVR",
            points: 110,
            demons: {
                extreme: 0,
                insane: 0,
                hard: 0,
                medium: 1,
                easy: 10
            }
        },
        {
            name: "Halloween",
            points: 90,
            demons: {
                extreme: 1,
                insane: 2,
                hard: 1,
                medium: 2,
                easy: 1
            }
        },
        {
            name: "William",
            points: 80,
            demons: {
                extreme: 1 "Being Verified",
                insane: 0,
                hard: 0,
                medium: 0,
                easy: 3
            }
        },
        {
            name: "Memex",
            points: 50,
            demons: {
                extreme: 0,
                insane: 0,
                hard: 0,
                medium: 0,
                easy: 5
            }
        },
        {
            name: "Barrel",
            points: 0,
            demons: {
                extreme: 0,
                insane: 0,
                hard: 0,
                medium: 0,
                easy: 0
            }
        }
    ];

    const list = document.getElementById("list");

    users.forEach(user => {
        const li = document.createElement("li");

        li.innerHTML = `
            <div class="row">
                <span>${user.name}</span>
                <span class="points">${user.points} pts</span>
            </div>
            <div class="details">
                Extreme Demons: ${user.demons.extreme}<br>
                Insane Demons: ${user.demons.insane}<br>
                Hard Demons: ${user.demons.hard}<br>
                Medium Demons: ${user.demons.medium}<br>
                Easy Demons: ${user.demons.easy}
            </div>
        `;

        const details = li.querySelector(".details");

        li.addEventListener("click", () => {
            details.style.display =
                details.style.display === "block" ? "none" : "block";
        });

        list.appendChild(li);
    });
</script>

</body>
</html>
