<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>

    <style>
        body {
            background: #0e0e0e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        ol {
            max-width: 500px;
            margin: auto;
            padding-left: 20px;
        }

        li {
            margin: 10px 0;
            background: #1c1c1c;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .points {
            color: #00ff88;
            font-weight: bold;
        }

        .rank {
            color: #ffaa00;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>

<body>

<h1>Leaderboard</h1>

<ol id="list"></ol>

<script>
    // 🔒 ONLY EDIT THIS LIST 🔒
    const users = [
        { rank: 1, name: "HaloPlaceVR", points: 110 },
        { rank: 2, name: "Halloween", points: 90 },
        { rank: 3, name: "William", points: 80 },
        { rank: 4, name: "Memex", points: 50 },
        { rank: 5, name: "Barrel", points: 0 }
    ];

    const list = document.getElementById("list");

    users.forEach(user => {
        const li = document.createElement("li");
        li.innerHTML = `
            <span><span class="rank">#${user.rank}</span>${user.name}</span>
            <span class="points">${user.points} pts</span>
        `;
        list.appendChild(li);
    });
</script>

</body>
</html>
