<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GD Friend Ranking (Made For Fun)</title>

    <style>
        body {
            background: #0e0e0e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            text-align: center;
        }

        ol {
            max-width: 400px;
            margin: auto;
            font-size: 18px;
        }

        li {
            margin: 10px 0;
            background: #1c1c1c;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rank {
            color: #ffaa00;
            font-weight: bold;
            margin-right: 6px;
        }

        .points {
            color: #00ff88;
            font-weight: bold;
        }

        .details {
            margin-top: 8px;
            font-size: 14px;
            color: #ccc;
            display: none;
        }

        .note {
            color: #ffaa00;
            font-style: italic;
        }

        .legend {
            max-width: 400px;
            margin: 40px auto 0;
            background: #151515;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .legend h2 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .legend p {
            margin: 4px 0;
        }
    </style>
</head>
<body>

<h1>Leaderboard</h1>

<ol id="list"></ol>

<!-- POINTS LEGEND -->
<div class="legend">
    <h2>Demon Points</h2>
    <p>Extreme Demon = 50 points</p>
    <p>Insane Demon = 40 points</p>
    <p>Hard Demon = 30 points</p>
    <p>Medium Demon = 20 points</p>
    <p>Easy Demon = 10 points</p>
</div>

<script>
    // 🔒 ONLY YOU EDIT THIS PART 🔒
    const users = [
        {
            name: "Spinerman",
            points: 120,
            demons: {
                extreme: 0,
                insane: 0,
                hard: 1,
                medium: 2,
                easy: 5
            }
        },
        {
            name: "HaloPlaceVR",
            points: 120,
            demons: {
                extreme: 0,
                insane: 0,
                hard: 0,
                medium: 1,
                easy: 11
            }
        },
        {
            name: "Halloween",
            points: 90,
            demons: {
                extreme: 0,
                insane: 0,
                hard: 0,
                medium: 1,
                easy: 7
            }
        },
        {
            name: "William",
            points: 80,
            demons: {
                extreme: 1,
                insane: 0,
                hard: 0,
                medium: 0,
                easy: 3
            },
            note: "Extreme Demon being verified"
        },
        {
            name: "Memex",
            points: 50,
            demons: {
                extreme: 0,
                insane: 0,
                hard: 0,
                medium: 0,
                easy: 5
            }
        },
        {
            name: "Barrel",
            points: 0,
            demons: {
                extreme: 0,
                insane: 0,
                hard: 0,
                medium: 0,
                easy: 0
            }
        }
    ];

    // Sort by points (highest first)
    users.sort((a, b) => b.points - a.points);

    const list = document.getElementById("list");

    users.forEach((user, index) => {
        const li = document.createElement("li");

        li.innerHTML = `
            <div class="row">
                <span><span class="rank">#${index + 1}</span>${user.name}</span>
                <span class="points">${user.points} pts</span>
            </div>
            <div class="details">
                Extreme Demons: ${user.demons.extreme}<br>
                Insane Demons: ${user.demons.insane}<br>
                Hard Demons: ${user.demons.hard}<br>
                Medium Demons: ${user.demons.medium}<br>
                Easy Demons: ${user.demons.easy}
                ${user.note ? `<br><span class="note">${user.note}</span>` : ""}
            </div>
        `;

        const details = li.querySelector(".details");

        li.onclick = () => {
            details.style.display =
                details.style.display === "block" ? "none" : "block";
        };

        list.appendChild(li);
    });
</script>

</body>
</html>
